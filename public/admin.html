<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle Beta Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oracle Stack</span></a><div class="top-actions"><span class="v1-pill">BETA ADMIN</span></div></header>
<section class="hero compact-hero"><p class="eyebrow">CONTROL ROOM</p><h1>Beta access.</h1><p class="subhead">Review applicants, set a monthly request quota, approve access, and copy the one-time API key.</p></section>
<section class="card" style="padding:28px;margin-bottom:20px"><form id="login"><label><strong>Admin token</strong></label><div style="display:flex;gap:10px;margin-top:10px"><input id="token" type="password" autocomplete="off" required placeholder="ORACLE_ADMIN_TOKEN" style="flex:1;padding:12px;border-radius:10px"><button class="ghost-btn">Load requests</button></div></form><p id="status"></p></section>
<section id="requests" class="card hidden" style="padding:28px"></section>
<section id="keybox" class="card hidden" style="padding:28px;margin-top:20px"><h2>New API key</h2><p><strong>Copy this now. It cannot be shown again.</strong></p><pre id="newkey" style="overflow:auto;white-space:pre-wrap"></pre><button id="copy" class="ghost-btn" type="button">Copy key</button></section>
</main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let admin='';
async function load(){const r=await fetch('/api/admin/beta-requests',{headers:{'x-oracle-admin':admin}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');const rows=d.requests||[];$('requests').innerHTML='<h2>Applicants ('+rows.length+')</h2>'+(rows.length?rows.map(x=>'<article style="padding:16px 0;border-bottom:1px solid #333"><strong>'+esc(x.name||'Unnamed')+'</strong> · '+esc(x.email)+'<p>'+esc(x.use_case||'No use case supplied')+'</p><p>Status: <strong>'+esc(x.status)+'</strong>'+(x.api_key_id?' · '+esc(x.api_key_id):'')+'</p>'+(x.status==='pending'?'<label>Monthly requests <input id="q-'+x.id+'" type="number" min="1" max="10000" value="100" style="width:100px;padding:8px"></label> <button class="ghost-btn approve" data-id="'+x.id+'">Approve</button>':x.status==='approved'?'<button class="ghost-btn revoke" data-id="'+x.id+'">Revoke key</button>':'')+'</article>').join(''):'<p>No beta requests yet.</p>');$('requests').classList.remove('hidden');document.querySelectorAll('.approve').forEach(b=>b.onclick=()=>approve(b.dataset.id));document.querySelectorAll('.revoke').forEach(b=>b.onclick=()=>revoke(b.dataset.id));}
async function revoke(id){if(!confirm('Revoke this API key immediately?'))return;const r=await fetch('/api/admin/beta-requests/'+id+'/revoke',{method:'POST',headers:{'x-oracle-admin':admin}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Revoke failed');await load();}
async function approve(id){if(!confirm('Approve this applicant and generate a key?'))return;const quota=Number($('q-'+id).value||100);const r=await fetch('/api/admin/beta-requests/'+id+'/approve',{method:'POST',headers:{'Content-Type':'application/json','x-oracle-admin':admin},body:JSON.stringify({quota})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Approval failed');$('newkey').textContent=d.apiKey;$('keybox').classList.remove('hidden');await load();}
$('login').onsubmit=async e=>{e.preventDefault();admin=$('token').value;sessionStorage.setItem('oracleAdminToken',admin);$('status').textContent='Loading…';try{await load();$('status').textContent=''}catch(x){$('status').textContent=x.message}};
$('copy').onclick=()=>navigator.clipboard.writeText($('newkey').textContent);
admin=sessionStorage.getItem('oracleAdminToken')||'';if(admin){$('token').value=admin;load().catch(()=>{})}
</script></body></html>
