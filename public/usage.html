<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle API Usage</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">O</span><span>Oracle Stack</span></a><div class="top-actions"><a class="ghost-btn" href="/developers.html">API Docs</a><span class="v1-pill">USAGE</span></div></header>
<section class="hero compact-hero"><p class="eyebrow">PRIVATE BETA</p><h1>Your Oracle usage.</h1><p class="subhead">Check quota, executions and token usage for your beta API key. Your key stays in this browser tab and is only sent to Oracle.</p></section>
<section class="card" style="padding:28px"><form id="usage-form"><label for="key"><strong>Oracle API key</strong></label><div style="display:flex;gap:10px;margin-top:10px"><input id="key" type="password" autocomplete="off" placeholder="Paste beta key" required style="flex:1;padding:12px;border-radius:10px"><button class="ghost-btn" type="submit">Load usage</button></div></form><p id="status"></p><div id="results" class="route-grid hidden"></div></section></main>
<script>
const form=document.getElementById('usage-form'),status=document.getElementById('status'),results=document.getElementById('results');
form.addEventListener('submit',async e=>{e.preventDefault();results.classList.add('hidden');status.textContent='Loading…';try{const r=await fetch('/v1/usage',{headers:{Authorization:'Bearer '+document.getElementById('key').value.trim()}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');const q=d.quota||{},p=d.persistent||{},m=d.currentProcess||{};const cards=[['API key',d.apiKeyId],['Quota used',q.used+' / '+q.limit],['Remaining',q.remaining],['Window',q.window],['Process executions',m.executions||0],['Process tokens',m.totalTokens||0],['30-day executions',p.executions??p.count??'—'],['30-day tokens',p.totalTokens??p.total_tokens??'—']];results.innerHTML=cards.map(([a,b])=>'<div><span class="detail-label">'+a+'</span><p>'+String(b??'—')+'</p></div>').join('');results.classList.remove('hidden');status.textContent='';}catch(err){status.textContent=err.message;}});
</script></body></html>
